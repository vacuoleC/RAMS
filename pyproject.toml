# RAMS 项目 · 构建配置
# 依据：.clinerules/00-核心规则.md 第 7、11 节
# 用途：源码打包（pip install -e . / wheel）、统一代码风格、类型检查、测试

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rams"
version = "0.1.0"
description = "Reservoir Algae Monitoring System - 轻量深度学习 + 五任务头"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "RAMS Project Team" },
]
# 运行时依赖以 environment.yml 为准（conda 优先），这里只放最小可 import 子集
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.10",
    "mypy>=1.7",
    "pre-commit>=3.5",
]

[project.scripts]
rams-build-dataset = "scripts.build_dataset:main"
rams-train = "scripts.train:main"

# —— 包发现 ——
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rams*"]
exclude = ["tests*", "notebooks*", "scripts*", "docs*", "data*", "configs*"]

# —— ruff：lint + format ——
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data", "mlruns", "outputs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "PT",  # pytest style
]
ignore = [
    "E501",  # line too long（black 负责）
    "B008",  # function call in default argument（dataclass / pydantic 常用）
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # assert False 是测试常用
"notebooks/**/*.py" = ["E402", "F811"]
# 张量维度变量（X/T/H/delta_T）沿用张量领域命名约定（与原 0.1.0 一致）
"rams/data/tensor_builder.py" = ["N806"]
"rams/models/rams_net.py" = ["N806"]
"rams/training/trainer.py" = ["N803", "N806"]
"rams/training/smoke_roll.py" = ["N806"]

# —— black：与 ruff 对齐 ——
[tool.black]
line-length = 100
target-version = ["py310"]

# —— mypy ——
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["data/", "mlruns/", "outputs/", "build/", "dist/"]

# —— pytest ——
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=rams",
    "--cov-report=term-missing",
    "--cov-fail-under=0",   # Stage 5 才改为 80
]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# —— coverage ——
[tool.coverage.run]
branch = true
source = ["rams"]
omit = [
    "rams/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
