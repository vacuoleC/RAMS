# RAMS 项目 · conda 环境
# 依据：.clinerules/00-核心规则.md 第 2 节
# 用法（Anaconda Prompt）：
#   conda env create -f environment.yml
#   conda activate rams
#   python -c "import torch; print(torch.__version__, torch.cuda.is_available(), torch.cuda.get_device_name(0))"
# 必须输出 True + 显卡名，否则停下报告负责人

name: rams
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python 与 PyTorch（GPU 版，CUDA 12.1）
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # ——以下走 pip 装（顺序装，冲突好排查）——
  # 注：conda 不直接支持 pip install，但 environment.yml 里可以列 - pip: 块

  - pip
  - pip:
      # 训练编排
      - lightning>=2.0
      - hydra-core>=1.3
      - omegaconf>=2.3

      # 数据
      - pandas>=2.0
      - polars>=0.20
      - openpyxl>=3.1
      - pyarrow>=14.0
      - pandera>=0.15
      - scikit-learn>=1.3

      # 实验追踪
      - mlflow>=2.8
      - optuna>=3.4
      - tensorboard>=2.15

      # 可解释性
      - shap>=0.43
      - captum>=0.7
      - tigramite>=5.2
      - mapie>=0.7

      # 部署
      - onnx>=1.15
      - onnxruntime>=1.16
      - fastapi>=0.104
      - uvicorn>=0.24

      # 可视化
      - matplotlib>=3.7
      - SciencePlots>=2.1
      - cmocean

      # 图神经网络（仅 M3 用）
      - torch-geometric>=2.4

      # 工具链
      - ruff>=0.1
      - black>=23.10
      - mypy>=1.7
      - pre-commit>=3.5
      - pytest>=7.4
      - pytest-cov>=4.1

      # 性能加速
      - numba>=0.58
      - numpy>=1.26
