budgets:
  attempts: unlimited
  compute: unlimited（H100 充足）
  money: unlimited
  network: unlimited（限公开/算力机）
  storage: unlimited
  time: unlimited
  tokens: unlimited
controller:
  controller_revision: 1
  path: skills/rams-algae-controller/SKILL.md
  skill_name: rams-algae-controller
deliverables:
- acceptance_criteria:
  - M1 目标改增量Δ + q9 分位数输出
  - 采样尺度改日级（T=30, H=7天）
  - M4 用藻华状态定义（顶层带+多层联动）
  - M2/M3/M5 结论整合（多任务头/选层输入/因果特征）
  deliverable_uid: a02dbf9f-fab8-465a-88d2-ac8500e1a14c
  evidence_requirements:
  - CRPS-vs-persistence
  - coverage
  - bloom-recall
  format: python package
  required: true
  review_policy: 每个模块冒烟通过即评审
  target_path: rams/
  validators:
  - pytest
  - smoke-test
- acceptance_criteria:
  - 含 0.2.0 模型架构描述
  - 含对比基线结果表
  - 含探索证据链索引
  deliverable_uid: 3a91c313-2855-4608-876c-186aab46e9d3
  evidence_requirements:
  - baseline-comparison
  format: markdown report
  required: true
  review_policy: 报告评审
  target_path: docs/model_v020_report.md
  validators:
  - doc-completeness
- acceptance_criteria:
  - 对比 PDF 基线（FLARE/GLM/rLakeAnalyzer/Qiu巢湖/Pontchartrain/统计ML）
  - 同协议（日级+滚动窗口+CRPS）
  - 算力机跑，跑不掉的记录降级方案
  deliverable_uid: 7ea896ae-3c15-48df-8015-4916de8965ef
  evidence_requirements:
  - baseline-crps-table
  format: markdown baseline report
  required: true
  review_policy: 基线报告评审
  target_path: docs/baseline_comparison.md
  validators:
  - baseline-reproducible
- acceptance_criteria:
  - pytest 全链路通过
  - 冒烟测试记录
  deliverable_uid: 74cb7a1f-9ecf-41c0-a716-03f72ab50e7b
  evidence_requirements:
  - pytest-output
  format: markdown test report
  required: true
  review_policy: 测试评审
  target_path: docs/test_report.md
  validators:
  - pytest-pass
environments:
- connection_method: local
  credential_references: []
  data_retention_policy: 涉密数据本地
  environment_id: local-dev
  environment_manager: conda
  environment_type: control
  host_alias: local-windows
  interpreter: python 3.13 / 3.10
  network_policy_ref: network_permissions
  os: Windows 11
  path_mappings: []
  project_path: D:/coding/26AIendwork
  resources:
    cpu: '16'
    disk: 100G
    gpu: RTX4060-8G
    memory: 32G
  responsibility: 代码开发 + 冒烟测试 + 文档
  shell: bash
  writable_paths:
  - rams
  - scripts
  - tests
  - docs
  - exp
- connection_method: ssh
  credential_references: []
  data_retention_policy: 涉密数据算力机，不外传
  environment_id: sensecore-h100
  environment_manager: other
  environment_type: compute
  host_alias: sensecore
  interpreter: python 3.8
  network_policy_ref: network_permissions
  os: Ubuntu 20.04
  path_mappings: []
  project_path: /data/RAMS/proj
  resources:
    cpu: '192'
    disk: 1.5T
    gpu: H100-80G
    memory: 2TB
  responsibility: 正式训练 + 对比基线 + 全量验证
  shell: bash
  writable_paths:
  - /data/RAMS/proj
final_acceptance:
- 正式模型（日级+滚动窗口）CRPS 相对持久化 >+20%
- M4 用藻华事件定义（N 探索）评估：召回率 + 提前量
- 落地代码通过 pytest 全链路
- 报告含完整探索证据链 + 对比基线结果
framework_adapters:
- adapter_id: claude-code
  required: true
  required_capabilities:
  - auto_continue
  - tool_post_observe
governance:
  cancellation_rules: []
  change_request_rules:
  - rule: 改已冻结设计需用户批准
  pause_rules:
  - rule: 遇到数据/架构红线冲突时暂停
  recovery_rules:
  - rule: 探索失败回滚到上一提交
  review_rules:
  - rule: 每个模块冒烟通过即停，交用户评审
  - rule: 涉密数据绝不打印原始值/不上传
