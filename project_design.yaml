network_permissions:
  dependency_installation:
    allowed_scope:
    - pip
    - conda
    approval_rule: auto-allowed-known
    data_level: public
  free_api:
    allowed_scope: []
    approval_rule: ask-first
    data_level: public
  literature_and_web_search:
    allowed_scope:
    - reservoir-algae-literature
    approval_rule: auto-allowed
    data_level: public
  paid_api:
    allowed_scope: []
    approval_rule: blocked
    data_level: public
  private_remote_service:
    allowed_scope: []
    approval_rule: blocked
    data_level: confidential
  project_data_upload:
    allowed_scope: []
    approval_rule: blocked
    data_level: confidential
  public_data_download:
    allowed_scope:
    - efi-usgs
    - thqbca
    - tick-tick-bloom
    approval_rule: auto-allowed
    data_level: public
  remote_compute_start:
