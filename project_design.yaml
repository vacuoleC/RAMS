    - sensecore
    approval_rule: auto-allowed
    data_level: confidential
permissions:
  commands:
  - python
  - pytest
  - pip
  - ssh sensecore
  - sync_sensecore.py
  dependency_changes:
  - pip install into sensecore
  - 本地 pip 补装需批准
  external_side_effects: []
  filesystem:
  - rams
  - scripts
  - tests
  - docs
  - exp
